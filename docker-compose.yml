services:
  # ─── PostgreSQL + PostGIS ──────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: chennai-flood-db
    environment:
      POSTGRES_DB: chennai_flood
      POSTGRES_USER: floodadmin
      POSTGRES_PASSWORD: floodpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./database/seed_streets.sql:/docker-entrypoint-initdb.d/03_seed_streets.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodadmin -d chennai_flood"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flood-network

  # ─── FastAPI Backend ───────────────────────────────────────
  backend:
    build: ./backend
    container_name: chennai-flood-backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_logs:/var/log/chennai-flood
    environment:
      DATABASE_URL: postgresql://floodadmin:floodpass@postgres:5432/chennai_flood
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      LOG_DIR: /var/log/chennai-flood
    networks:
      - flood-network

  # ─── React Frontend ───────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: chennai-flood-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - flood-network

volumes:
  pgdata:
    driver: local
  app_logs:
    driver: local

networks:
  flood-network:
    driver: bridge
