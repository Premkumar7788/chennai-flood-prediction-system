version: '3.8'

services:
  # ─── Elasticsearch ──────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: sprint10-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=chennai-flood-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'cluster_name'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─── Logstash ───────────────────────────────────────────────
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: sprint10-logstash
    environment:
      - "LS_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - app_logs:/var/log/chennai-flood:ro
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "5044:5044"
      - "8080:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-network

  # ─── Kibana ─────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: sprint10-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana.sprint10.local
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-network

volumes:
  es_data:
    driver: local
  app_logs:
    driver: local

networks:
  elk-network:
    driver: bridge
