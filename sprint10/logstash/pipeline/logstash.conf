# ==============================================================================
# Chennai Street-Level Flood Prediction System - Logstash Pipeline
# Course: ISWE406P - Agile Development Process and DevOps Lab
# ==============================================================================

input {
  # 1. TCP Input for Direct Application Socket Logging
  tcp {
    port => 5000
    codec => json_lines
    type => "tcp-json"
  }

  # 2. HTTP Input for REST Log Ingestion Probes
  http {
    port => 8080
    codec => json
    type => "http-json"
  }

  # 3. Beats Input for Container Log Streaming (Filebeat)
  beats {
    port => 5044
    type => "beats"
  }

  # 4. File Input for Shared Container Log Volume
  file {
    path => "/var/log/chennai-flood/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "app-file"
    codec => multiline {
      pattern => "^%{TIMESTAMP_ISO8601}"
      negate => true
      what => "previous"
    }
  }
}

filter {
  mutate {
    add_field => { "environment" => "production-simulation" }
    add_field => { "service" => "chennai-flood-backend" }
  }

  # If incoming payload is already structured JSON with log_level
  if [level] {
    mutate {
      add_field => { "log_level" => "%{level}" }
    }
  }

  # Parse unstructured plaintext log lines
  if [message] and ![log_level] {
    # Grok Pattern 1: FastAPI Custom Logger: 2026-10-20 20:30:15.123 [INFO] app.api.endpoints.prediction: Message
    grok {
      match => {
        "message" => [
          "^%{TIMESTAMP_ISO8601:log_timestamp} \[%{LOGLEVEL:log_level}\] %{DATA:logger}: %{GREEDYDATA:log_message}",
          "^\[%{TIMESTAMP_ISO8601:log_timestamp}\] \[%{LOGLEVEL:log_level}\] %{DATA:logger} - %{GREEDYDATA:log_message}",
          "%{IPORHOST:client_ip}:%{POSINT:client_port} - \"%{WORD:http_method} %{URIPATHPARAM:http_endpoint} HTTP/%{NUMBER:http_version}\" %{POSINT:http_status:int} - %{GREEDYDATA:log_message}",
          "^%{LOGLEVEL:log_level}:%{SPACE}%{GREEDYDATA:log_message}"
        ]
      }
      overwrite => [ "log_message" ]
    }

    # Normalize log level to uppercase
    if [log_level] {
      mutate {
        uppercase => [ "log_level" ]
      }
    } else {
      mutate {
        add_field => { "log_level" => "INFO" }
      }
    }

    # Derive error category if level is ERROR or WARN
    if [log_level] == "ERROR" {
      if [message] =~ /(?i)(validation|pydantic|valueerror|422)/ {
        mutate { add_field => { "error_type" => "PayloadValidationError" } }
      } else if [message] =~ /(?i)(connection|database|timeout|sql)/ {
        mutate { add_field => { "error_type" => "DatabaseConnectionTimeout" } }
      } else if [message] =~ /(?i)(lightgbm|model|inference)/ {
        mutate { add_field => { "error_type" => "ModelInferenceException" } }
      } else {
        mutate { add_field => { "error_type" => "GeneralApplicationError" } }
      }
    }
  }

  # Synchronize event timestamp
  if [log_timestamp] {
    date {
      match => [ "log_timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd HH:mm:ss" ]
      target => "@timestamp"
      remove_field => [ "log_timestamp" ]
    }
  }
}

output {
  # Forward structured events to Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "chennai-flood-logs-%{+YYYY.MM.dd}"
  }

  # Debug output to Logstash container stdout
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
